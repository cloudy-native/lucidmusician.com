    - generic [ref=f47e84]:
      - generic [ref=f47e85]:
        - paragraph [ref=f47e86]: 04 · Features
        - heading "What it actually does" [level=2] [ref=f47e87]
      - list [ref=f47e88]:
        - listitem [ref=f47e89]:
          - paragraph [ref=f47e90]:
            - text: Follow Me
            - generic [ref=f47e91]: A second pair of hands.
          - paragraph [ref=f47e92]: Play a line on the keyboard and LucidHarmony voices harmony underneath in real time. Same on-device model as Generate, now following you instead of leading.
        - listitem [ref=f47e93]:
          - paragraph [ref=f47e94]:
            - text: Generate
            - generic [ref=f47e95]: A new sequence every click.
          - paragraph [ref=f47e96]: Pick key, model, and richness, then click Generate. Finite bars or Infinite mode. Each pass is a different, musically coherent progression.
        - listitem [ref=f47e97]:
          - paragraph [ref=f47e98]:
            - text: Harmonic Explorer
            - generic [ref=f47e99]: Scored alternatives, not a grid.
          - paragraph [ref=f47e100]: Inspect the current sequence, revoice it, and swap chords for scored alternatives. Regenerate as many times as you like without leaving the plugin.
        - listitem [ref=f47e101]:
          - paragraph [ref=f47e102]:
            - text: MIDI export
            - generic [ref=f47e103]: From plugin to piano roll.
          - paragraph [ref=f47e104]: Drag a single clip or split voices onto separate tracks. The voicing that sounded right in the plugin is the MIDI that lands in your DAW.
        - listitem [ref=f47e105]:
          - paragraph [ref=f47e106]:
            - text: Presets
            - generic [ref=f47e107]: Start closer to the cue.
          - paragraph [ref=f47e108]: Factory presets cover ambient, choral, and cinematic starting points. Save your own once a setting earns a place in the session.
        - listitem [ref=f47e109]:
          - paragraph [ref=f47e110]:
            - text: Intuitive and Advanced
            - generic [ref=f47e111]: One plugin, two depths.
          - paragraph [ref=f47e112]: "Intuitive keeps the path short: generate, play, drag. Advanced opens voicing, parallel motion, and style controls when the cue needs a tighter hand."
