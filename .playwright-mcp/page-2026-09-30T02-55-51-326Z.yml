    - generic [ref=f47e167]:
      - generic [ref=f47e168]:
        - paragraph [ref=f47e169]: 08 · FAQ
        - heading "Before you install" [level=2] [ref=f47e170]
      - generic [ref=f47e171]:
        - generic [ref=f47e172]:
          - term [ref=f47e173]: How is LucidHarmony different from Scaler or Captain Chords?
          - definition [ref=f47e174]: LucidHarmony generates MIDI for ambient and scoring with an on-device transformer, Follow Me, and infinite sequences. Scaler and Captain Chords are theory workstations with analysis and large libraries; this plugin does not replace that job.
        - generic [ref=f47e175]:
          - term [ref=f47e176]: Is it an instrument?
          - definition [ref=f47e177]: No. It is a MIDI effect. Generate or play, then route the MIDI to a software instrument. Silence usually means there is no instrument on the track.
        - generic [ref=f47e178]:
          - term [ref=f47e179]: Which formats and operating systems?
          - definition [ref=f47e180]: VST3, AU, and CLAP on Windows, Mac, and Linux. Any DAW that hosts those formats.
        - generic [ref=f47e181]:
          - term [ref=f47e182]: Does generation need the internet?
          - definition [ref=f47e183]: No. Inference runs on-device. A license check may run at startup; it never disables the plugin.
        - generic [ref=f47e184]:
          - term [ref=f47e185]: How does licensing work?
          - definition [ref=f47e186]: Buy on Gumroad, enter the key in the About tab. Multiple computers, offline use after first validation. Unlicensed use shows a reminder without blocking features.
        - generic [ref=f47e187]:
          - term [ref=f47e188]: What if it is not for me?
          - definition [ref=f47e189]: Gumroad offers a 30-day money-back guarantee on the license.
        - generic [ref=f47e190]:
          - term [ref=f47e191]: Who is this not for?
          - definition [ref=f47e192]: If you need to analyze existing MIDI or browse a chord dictionary, use Scaler. LucidHarmony is for generating and voicing new progressions.
        - generic [ref=f47e193]:
          - term [ref=f47e194]: How do I install it?
          - definition [ref=f47e195]: Download from Gumroad, install the VST3, AU, or CLAP, then rescan plugins in your DAW. The docs page has per-DAW paths.
