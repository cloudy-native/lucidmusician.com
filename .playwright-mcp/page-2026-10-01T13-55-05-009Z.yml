            - generic [ref=e41]: Dr. Stephen James Harrison, PhD
            - generic [ref=e42]: "\"It builds, it ships\""
            - paragraph [ref=e43]: The doctorate was the respectable chapter. Then he spent it on a MIDI plugin, a website, and a build matrix that would make a thesis committee weep. He writes the code, reviews the code, and is, regrettably, also the CI.
