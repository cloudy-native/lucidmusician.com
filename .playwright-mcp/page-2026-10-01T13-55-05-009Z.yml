            - generic [ref=e26]: "\"Always delegate\""
            - paragraph [ref=e27]: SJ incorporated a company with a complete C-suite. They all answer to the same bathroom mirror. His job is to point Lucid Musician at the interesting problems and the other Stephens at everything else.
        - generic [ref=e28]:
