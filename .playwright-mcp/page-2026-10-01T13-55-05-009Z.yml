            - generic [ref=e32]: Chief Music Officer
            - generic [ref=e33]: J. Roger Harrison
            - generic [ref=e34]: "\"You pay extra for black notes\""
            - paragraph [ref=e35]: Roger is the one who actually listens. If a chord is theoretically correct and musically boring, it does not ship. He tests every feature as if a session is booked at ten, because in his head it is.
        - generic [ref=e36]:
