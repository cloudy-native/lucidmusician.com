            - generic [ref=e49]: S. James-Roger Harrison
            - generic [ref=e50]: "\"I don't do pixels or RGB\""
            - paragraph [ref=e51]: He does, in fact, do both. He just prefers not to be caught. Brand, layout, and the quiet removal of anything that looks like it was designed at 2 a.m. remain his department of one.
